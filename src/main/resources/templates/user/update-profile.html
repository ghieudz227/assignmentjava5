<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cập nhật thông tin tài khoản</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container11 {
        max-width: 500px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .btn-primary {
        background-color: #00483d;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container11">
        <h2 class="text-center">Cập nhật thông tin tài khoản</h2>

        <form id="updateForm" action="/update-profile" method="post">
          <div class="row mt-3">
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  th:value="${userlogin.username}"
                  class="form-control"
                  id="username"
                  readonly
                  required
                />
              </div>
            </div>
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="fullname" class="form-label">Họ và Tên</label>
                <input
                  type="text"
                  th:value="${userlogin.fullname}"
                  name="fullname"
                  class="form-control"
                  id="fullname"
                  required
                />
              </div>
            </div>

            <div class="col-lg-12">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  th:value="${userlogin.email}"
                  name="email"
                  class="form-control"
                  id="email"
                  required
                />
              </div>
            </div>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary w-100">
              Cập nhật
            </button>

            <i style="color: rgb(55, 215, 7) ;" th:text="${message}"></i>
          </div>
        </form>
      </div>
      
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

   
  </body>
</html>
