<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Mua Sắm</title>
    <!-- Link Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 6.2.0 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
      integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- (Optional) Use CSS or JS implementation -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/js/all.min.js"
      integrity="sha512-naukR7I+Nk6gp7p5TMA4ycgfxaZBJ7MO5iC3Fp6ySQyKFHOGfpkSZkYVWV5R7u7cfAicxanwYQ5D1e17EfJcMA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Header */

      header .form-control {
        max-width: 300px;
      }

      header .btn {
        white-space: nowrap;
      }

      a {
        text-decoration: none;
      }

      /* Banner */
      .banner img {
        border-radius: 8px;
      }

      /* Hiệu ứng hover */
      .product-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      }

      .product-card img {
        transition: transform 0.3s ease, filter 0.3s ease;
      }

      .product-card:hover img {
        transform: scale(1.05);
        filter: brightness(1.1);
      }

      .product img {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .product {
        padding: 0 2px; /* Giảm khoảng cách ngang */
      }

      .product:hover img {
        transform: scale(1.1);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .product-card-hover {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .product-card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      }

      .product-card-hover img {
        transition: transform 0.3s ease, filter 0.3s ease;
      }

      .product-card-hover:hover img {
        transform: scale(1.05);
        filter: brightness(1.1);
      }

      .product-card-hover .btn {
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      /* .product-card-hover:hover .btn {
        background-color: #ff5722;
        transform: scale(1.05);
      } */

      /* Header cải tiến */
      header {
        background-color: #1485e1; /* Màu xanh primary */
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      }

      header .btn-light {
        color: #2876c8;
        font-weight: bold;
      }

      header .form-control {
        border-radius: 20px 0 0 20px; /* Bo góc cho input */
        border-right: none; /* Ẩn viền bên phải của input */
      }

      header .btn-warning {
        border-radius: 0 20px 20px 0; /* Bo góc cho nút tìm kiếm */
        font-weight: bold;
      }

      header .dropdown-toggle {
        border-radius: 20px;
      }

      header .bi {
        font-size: 1.2rem;
      }
      /* footer */

      footer {
        border-top: 3px solid #007bff; /* Đường viền xanh phía trên */
      }

      footer h6 {
        color: #333;
      }

      footer p {
        font-size: 14px;
        line-height: 1.6;
      }

      footer a:hover {
        color: #007bff;
        text-decoration: underline;
      }

      .sp {
        width: 262px;
      }
    </style>
  </head>
  <body>
    <section class="py-4">
      <div class="container">
        <h3 class="text-dark mb-4">
          Sản phẩm theo : <span th:text="${categoryName}"></span>
        </h3>
      

        <div class="row row-cols-1 row-cols-md-4 g-3">
          <th:block th:each=" item: ${productby}">
            <!-- Sản phẩm 1 -->
            <div class="col sp">
              <div class="card product-card h-100 border-0 shadow-sm">
                <a style="text-decoration: none; color: black;" th:href="@{|/detail/${item.id}|}">
                  <img
                    th:src="@{|/img/${item.image}|}"
                    class="card-img-top"
                    alt="Sản phẩm"
                  />
                  <div class="card-body text-center">
                    <h6 class="card-title" th:text="${item.name}">
                      Nồi cơm điện tử Sharp 1.8 lít KS-COM194EV-RD
                    </h6>
                    <p
                      class="price text-danger fw-bold"
                      th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')}"
                    >
                      1.750.000 đ
                    </p>
                    <p class="text-muted small mb-1">
                      <i
                        class="bi bi-check-circle me-1"
                        th:text="${item.description}"
                      ></i>
                      9 chế độ nấu
                    </p>
                  </div>
                </a>
              </div>
            </div>
          </th:block>
        </div>
      </div>
    </section>

    <!-- Danh sách sản phẩm -->

    <!-- footer -->

    <!-- Link Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
