<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Mua Sắm</title>
    <!-- Link Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 6.2.0 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
      integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- (Optional) Use CSS or JS implementation -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/js/all.min.js"
      integrity="sha512-naukR7I+Nk6gp7p5TMA4ycgfxaZBJ7MO5iC3Fp6ySQyKFHOGfpkSZkYVWV5R7u7cfAicxanwYQ5D1e17EfJcMA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body>
    <!-- Header -->
    <section class="banner mt-3">
      <div class="container">
        <img
          src="/img/banner.png"
          class="img-fluid w-100"
          alt="Ngày Đen Giảm Đỏ"
        />
      </div>
    </section>



    <section class="py-4">
      <div class="container">
        <h3 class="text-dark mb-4">Sản phẩm theo: <u th:text="${keyword}"></u> </h3> 
        <div class="row row-cols-1 row-cols-md-4 g-3">
          <!-- Sản phẩm 1 -->
          <th:block th:each="item : ${searchbyname}">
          <div class="col sp">
           
              <div class="card product-card h-100 border-0 shadow-sm">
                <a
                  style="text-decoration: none; color: black;"
                  th:href="@{|/detail/${item.id}|}"
                >
                  <img
                    th:src="@{|/img/${item.image}|}"
                    class="card-img-top"
                    alt="Sản phẩm"
                  />
                  <div class="card-body text-center">
                    <h6 class="card-title" th:text="${item.name}">
                      Nồi cơm điện tử Sharp 1.8 lít KS-COM194EV-RD
                    </h6>
                    <p class="price text-danger fw-bold" th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')}">1.750.000 đ</p>
                    <p class="text-muted small mb-1">
                      <i class="bi bi-check-circle me-1"></i> 9 chế độ nấu
                    </p>
                  
                  </div>
                </a>
              </div>
          </div>
        </th:block>

          <!-- Sản phẩm 2 (Copy và dán để thêm sản phẩm) -->

          <!-- Thêm sản phẩm tương tự -->
        </div>
      </div>
    </section>

    <!-- spham moi nhat -->

    <!-- Danh sách sản phẩm -->

    <!-- Link Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
