<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Mua Sắm</title>
    <!-- Link Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome 6.2.0 CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
      integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- (Optional) Use CSS or JS implementation -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/js/all.min.js"
      integrity="sha512-naukR7I+Nk6gp7p5TMA4ycgfxaZBJ7MO5iC3Fp6ySQyKFHOGfpkSZkYVWV5R7u7cfAicxanwYQ5D1e17EfJcMA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="text-white py-2">
      <div class="container d-flex align-items-center justify-content-between">
        <!-- Logo và tìm kiếm -->
        <div class="d-flex align-items-center">
          <a href="/home">
            <img width="200px" class="p-1" src="/img/logo.png" alt="" />
          </a>
          <button
            class="btn btn-light me-3  shadow-sm dropdown-toggle"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            id="menuCategory"
          >
           ☰
          Danh mục 
           
          </button>
          <ul class="dropdown-menu " aria-labelledby="menuCategory">
              <th:block th:each="category : ${categories}">
                <li>
                  <a
                    th:href="@{|/home/${category.id}|}"
                    class="dropdown-item"
                    th:text="${category.name}"
                  ></a>

              </th:block>
            </ul>
             <form action="/home/search" method="get">
              <div class="input-group">
              
                  <input
                  type="text"
                  name="keyword"
                  class="form-control"
                  placeholder="Bạn tìm gì..."
                  aria-label="Tìm kiếm"
                />
                <button class="btn btn-warning px-4">🔍</button>
              
              </div>
            </form>
        </div>

        <!-- Thông tin người dùng -->
        <div class="d-flex align-items-center">
          
          <div class="dropdown me-4">
            <button
              class="btn btn-light dropdown-toggle text-primary shadow-sm"
              type="button"
              id="userMenu"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
            <i th:if="${session.user == null}">Account</i>
            <i class="bi bi-person-circle" th:unless="${session.user == null}" th:text="${session.user.fullname}"></i>

              
            </button>
                <ul class="dropdown-menu" aria-labelledby="userMenu">
                       <!-- Nếu chưa đăng nhập -->
                    <li th:if="${session.user == null}">
                      <a class="dropdown-item" href="/login">Đăng nhập</a>
                    </li>
                    <li th:if="${session.user == null}">
                      <a class="dropdown-item" href="#">Đăng ký</a>
                    </li>

                    <!-- Nếu đã đăng nhập -->
                    <li th:if="${session.user != null}">
                      <a class="dropdown-item" href="/update-profile"> <i class="fa-solid fa-id-card"></i> Thông tin tài khoản</a>
                    </li>

                    <li th:if="${session.user != null}">
                      <a class="dropdown-item" href="/changepassword"> <i class="fa-solid fa-key"></i> Đổi mật khẩu </a>
                    </li>
                   

                    <!-- Chỉ hiển thị cho admin -->
                    <li th:if="${session.user != null and session.user.admin}">
                      <a href="/admin/product/index" class="dropdown-item">
                        <i class="fa-solid fa-list-check"></i> Quản lý Sản Phẩm (Admin)
                      </a>
                    </li>
                     <li th:if="${session.user != null}">
                      <a th:href="@{/logout}" class="dropdown-item"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
                    </li>
                </ul>

          </div>
          <div class="d-flex align-items-center me-4 position-relative">
            <a
              href="/cart/index"
              class="d-flex align-items-center"
              style="color: white; text-decoration: none"
            >
              <i class="fa-solid fa-cart-shopping fs-4 me-2"></i>
              <span>Giỏ hàng</span>
              <span
                th:if="${countCart != null and countCart > 0}"
                th:text="${countCart}"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                style="font-size: 0.75rem; padding: 0.3em 0.6em"
              ></span>
            </a>
          </div>

          <!-- <div class="d-flex align-items-center me-4 position-relative">
            <a
              href="/myOrder"
              class="d-flex align-items-center"
              style="color: white; text-decoration: none"
            >
              <i class="fa-solid fa-cart-shopping fs-4 me-2"></i>
              <span>Đơn hàng của tôi </span>
              <span
                th:if="${session.user != null}"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                style="font-size: 0.75rem; padding: 0.3em 0.6em"
              ></span>
            </a>
          </div> -->
          <div class="d-flex align-items-center me-4 position-relative">
           <a th:href="${session.user != null} ? @{/myOrder/{username}(username=${session.user.username})} : '#'"
                class="d-flex align-items-center"
                style="color: white; text-decoration: none">
                <i class="fa-solid fa-cart-shopping fs-4 me-2"></i>
                <span>Đơn hàng của tôi</span>
                
            </a>

          </div>
        </div>
      </div>
    </header>

    <!-- Banner -->

    <!-- Link Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
