<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      .cart-container {
        max-width: 600px;
        margin: 20px auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .price {
        color: red;
        font-weight: bold;
      }
      .old-price {
        text-decoration: line-through;
        color: gray;
      }
      .delivery-box {
        background: #f1f3f4;
        padding: 15px;
        border-radius: 8px;
      }

      .alert {
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.5s ease;
     }

      
    </style>
  </head>

  <body>
    <div class="container cart-container">
      <h4>Giỏ hàng của bạn</h4>
      <small th:text="${succesMessage}"></small>

      <!-- Giỏ hàng trống -->
      <div th:if="${#lists.isEmpty(cart)}" class="text-center mt-4">
        <p>Chưa có sản phẩm trong giỏ hàng</p>
      </div>

      <!-- Danh sách sản phẩm trong giỏ hàng -->
      <div th:unless="${#lists.isEmpty(cart)}">
        <div th:each="item : ${cart}" class="border-bottom pb-3 mb-3">
          <div class="d-flex align-items-center">
            <a th:href="@{|/detail/${item.id}|}">
              <img
                th:src="@{|/img/${item.image}|}"
                alt="Sản phẩm"
                width="80"
                class="me-3"
              />
            </a>
            <div>
              <h5 th:text="${item.name}">Tên sản phẩm</h5>
             
              <p
                class="price"
                th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')}"
              >
                Giá sản phẩm
              </p>
            </div>
          </div>

          <div class="d-flex justify-content-end align-items-center mt-2">
            <a
              th:href="@{|/cart/remove/${item.id}|}"
              class="btn btn-outline-secondary btn-sm"
              >-</a
            >
            <form
              th:action="@{|/cart/update/${item.id}|}"
              method="post"
              class="mx-2"
            >
              <input
                type="text"
                name="qty"
                th:value="${item.qty}"
                class="form-control text-center"
                style="width: 50px"
                onblur="this.form.submit()"
              />
            </form>
            <a
              th:href="@{|/cart/add/${item.id}|}"
              class="btn btn-outline-secondary btn-sm"
              >+</a
            >
          </div>

          <p class="text-end mt-2">
            <strong>Tạm tính:</strong>
            <span
              class="price"
              th:text="${#numbers.formatDecimal(item.price * item.qty,0,'COMMA',0,'POINT')}"
            >
              Tổng giá
            </span>
          </p>
        </div>

        <!--  -->
        <form action="/cart/checkout" method="post">
          <div class="delivery-box mt-4">
            <h5>Thông tin nhận hàng</h5>
            <div class="d-flex align-items-center">
              <div>
                <p class="mb-1" th:each="item : ${cart}">
                  <strong>Tên sản phẩm:</strong>
                  <span th:text="${item.name}"></span>
                </p>
              </div>
            </div>
            <p class="mt-2">
              <label for="address">Địa chỉ nhận hàng </label>
              <input
                type="text"
                id="address"
                name="address"
                class="form-control"
              />
              <small style="color: red;" th:text="${messageAddress}"></small>
            </p>

            <p class="mt-2">
              Phí giao hàng: <span class="text-success">Miễn phí</span>
            </p>
            <h4 class="mt-2">
              Tổng tiền phải thanh toán:
              <span
                th:text="${#numbers.formatDecimal(tongTienThanhToan,0,'COMMA',0,'POINT')} + ' VND'"
                >Miễn phí</span
              >
          
            </h4>
          </div>

          <button
            onclick="return confirm('Xác nhận đặt hàng !')"
            class="btn btn-primary w-100 mt-3"
          >
            Đặt hàng
          </button>
        </form>
      </div>
    </div>

    <!-- Link Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    
  </body>
</html>
