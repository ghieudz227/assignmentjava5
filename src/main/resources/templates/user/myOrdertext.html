<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn hàng đã mua</title>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <style>
      .container222 {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 1200px;
        margin: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .header11 {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .filter-bar button {
        padding: 10px 20px;
        border: 1px solid #ccc;
        background-color: white;
        border-radius: 5px;
        cursor: pointer;
      }
      .filter-bar button:hover {
        background-color: #e0e0e0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }
      th {
        background-color: #007bff;
        color: white;
      }
      .order-details {
        text-decoration: none;
        background-color: #007bff;
        color: white;
        padding: 8px 12px;
        border-radius: 5px;
      }
      .order-details:hover {
        background-color: #0056b3;
      }
      .order-status {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container222 mt-5 mb-5">
      <div class="header11">Đơn hàng đã mua</div>

      <table>
        <thead>
          <tr>
            <th>Mã đơn hàng</th>
            <th>Người mua</th>
            <th>Địa chỉ nhận hàng</th>
            <th>Ngày mua hàng</th>       
            <th>Chi tiết</th> 
          </tr>
        </thead>
        <tbody>
          <th:block th:each="order : ${myOrder}">
            <tr>
            <td th:text="${order.id}">#00434SO22080437601</td>
              <td th:text="${order.account.fullname}">#00434SO22080437601</td>
              <td th:text="${order.address}">Địa chỉ nhận hàng</td>
              <td th:text="${order.createDate}">Địa chỉ nhận hàng</td>
              
            

              <td><a th:href="@{|/myOrderDetails/${order.id}|}" class="order-details">Xem chi tiết</a></td>
            </tr>
          </th:block>
        </tbody>
      </table>
    </div>
  </body>
</html>
