<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cập nhật thông tin tài khoản</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .container11 {
        max-width: 500px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .btn-primary {
        background-color: #00483d;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container11">
        <h2 class="text-center"> Đổi mật khẩu </h2>

        <form action="/changepassword" method="post">
          <div class="row mt-3">
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  th:value="${userlogin.username}"
                  class="form-control"
                  id="username"
                  readonly
                  required
                />
              </div>
            </div>
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu hiện tại</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  id="password"
                  required
                />  
                <span style="color: red;" th:text="${messageCurrentPass}"></span>

              </div>
            </div>

            <div class="col-lg-6">
              <div class="mb-3">
                <label for="newpass" class="form-label">Mật khẩu mới </label>
                <input
                  type="password"
                  name="newpass"
                  class="form-control"
                  id="newpass"
                  required
                />
              </div>
            </div>
            <div class="col-lg-6">
              <div class="mb-3">
                <label for="confirmnewpass" class="form-label">Xác nhận mật khẩu mới </label>
                <input
                  type="password"
                
                  name="confirmnewpass"
                  class="form-control"
                  id="confirmnewpass"
                  required
                />
               
              </div>
            </div>
             <span style="color: red;" th:text="${messageConfirmpass}"></span> <br>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary w-100">
              Cập nhật
            </button>

            <i style="color: rgb(55, 215, 7) ;font-size: 18px;" th:text="${message}"></i>
          </div>
        </form>
      </div>
      
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

   
  </body>
</html>
