<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .product-image {
        width: 30px;
        height: 30px;
        object-fit: cover;
        border-radius: 8px;
      }
      .btn-edit {
        background-color: #3b82f6;
        color: white;
      }
      .btn-delete {
        background-color: #e3342f;
        color: white;
      }
      .tt {
        margin-top: 10px;
      }

      .buttonn {
        display: flex;
        justify-content: center; /* Canh giữa */
        gap: 20px; /* Khoảng cách giữa các nút */
        margin-top: 20px; /* Thêm khoảng cách phía trên */
      }

      .buttonn a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background-color: #3b82f6; /* Màu nền */
        color: white; /* Màu icon */
        border-radius: 50%; /* Bo tròn */
        text-decoration: none; /* Bỏ gạch chân */
        font-size: 18px;
        transition: background-color 0.3s ease;
      }

      .buttonn a:hover {
        background-color: #2563eb; /* Màu nền khi hover */
      }
      .card-header {
        background-color: #b3e0f2;
      }
      .form-label {
        font-weight: bold;
      }
      .btn-save {
        background-color: #3b82f6;
        color: white;
      }
      .btn-clear {
        background-color: #38c172;
        color: white;
      }
      .btn-save {
        background-color: #3b82f6;
        color: white;
      }
      .btn-clear {
        background-color: #38c172;
        color: white;
      }

      .product-image {
        width: 90px;
        height: 80px;
        border-radius: 10px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>

   
    <div class="container mt-5">
      <div class="card shadow-lg">
        <div class="card-header text-center">
          <h4>Thêm Loại Sản Phẩm</h4>
        </div>
        <div class="card-body">
          <form
          
            action="/admin/category/add"
            method="post"
            enctype="multipart/form-data"
            th:object="${category}"
          >
            <div class="row">
              <!-- Thông tin sản phẩm -->
              <div class="col-md-9">
                <div class="mb-3">
                  <label for="id" class="form-label">ID</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id"
                    th:field="*{id}"
                    placeholder="Category ID"
                    
                  />
                </div>
                <div class="mb-3">
                  <label for="name" class="form-label">Loại sản phẩm </label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"   
                    th:field="*{name}"
                    placeholder="Name Category"
                    required
                  />
                </div>
                

                <!-- Nút Save và Clear -->
                <div class="d-flex justify-content-start gap-2">
                  <button formaction="/admin/category/add" class="btn btn-save">Save</button>
                  <button formaction="/admin/category/update" class="btn btn-clear">Update </button>
                  <a href="/admin/category/reset">Reset</a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    

  
  </body>
</html>
