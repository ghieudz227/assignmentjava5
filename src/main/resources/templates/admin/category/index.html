<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản trị - Điện Máy Xanh</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    body {
        font-family: Arial, sans-serif;
    }
    .sidebar {
        
        background-color: #004d99; /* Xanh đậm thương hiệu */
        padding: 20px;
        color: white;
    }
    .sidebar h4 {
        color: #ffc107; /* Màu vàng */
    }
    .nav-link {
        color: white;
    }
    .nav-link:hover, .nav-link.active {
        background-color: #ffc107;
        color: black;
        font-weight: bold;
    }
    .navbar {
        background-color: #0073e6;
    }
    .navbar .nav-link, .navbar .dropdown-toggle {
        color: white;
    }
    .navbar .nav-link:hover {
        color: #ffc107;
    }
    .modal-header {
        background-color: #0073e6;
        color: white;
    }
    .btn-warning {
        background-color: #ffc107;
        border: none;
    }
    .btn-warning:hover {
        background-color: #e0a800;
    }
    .footer{
        background-color: gray;
        text-align: center;
        height: 50px;
    }
</style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 sidebar">
                <h4 class="text-center">ĐIỆN MÁY XANH</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mt-2"><a class="nav-link btn w-100 text-start" href="/home"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                    <li class="nav-item mt-2"><a class="nav-link btn w-100 text-start" href="/AssignmentJava4/Admin/Video/index"><i class="fa-solid fa-video"></i> Quản lý Tài Khoản</a></li>
                    <li class="nav-item mt-2"><a class="nav-link btn w-100 text-start" href="/admin/category/index"><i class="fa-solid fa-user"></i> Quản lý LSP</a></li>
                    <li class="nav-item mt-2"><a class="nav-link btn w-100 text-start" href="/AssignmentJava4/Admin/Reports"><i class="fa-solid fa-list-check"></i> Thống kê, báo cáo</a></li>
                    <li class="nav-item mt-2"><a class="nav-link btn w-100 text-start" href="/admin/product/index"><i class="fa-solid fa-box"></i> Quản Lý Sản Phẩm</a></li>
                </ul>
            </nav>

            <!-- Main content -->
            <div class="col-md-10">
               
                <th:block th:replace="@{/admin/category/table}">

                </th:block>
                
                <!-- <th:block th:replace="@{/admin/category/form}">

                </th:block> -->

                 

                <!-- <div class="content p-3">
                    <jsp:include page="${view}"></jsp:include>
                </div> -->
            </div>
        </div>
    </div>
    <footer class="footer">
        @by Gia hieu
    </footer>

    <script>
        const links = document.querySelectorAll(".sidebar .nav-link");
        const currentPath = window.location.pathname;
        links.forEach(link => {
            if (link.getAttribute("href") === currentPath) {
                link.classList.add("active");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
