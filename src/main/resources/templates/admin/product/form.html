<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>

      small{
        color: red;
      }
      .btn-edit {
        background-color: #3b82f6;
        color: white;
      }
      .btn-delete {
        background-color: #e3342f;
        color: white;
      }
      .tt {
        margin-top: 10px;
      }

      .buttonn {
        display: flex;
        justify-content: center; /* Canh giữa */
        gap: 20px; /* Khoảng cách giữa các nút */
        margin-top: 20px; /* Thêm khoảng cách phía trên */
      }

      .buttonn a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        background-color: #3b82f6; /* Màu nền */
        color: white; /* Màu icon */
        border-radius: 50%; /* Bo tròn */
        text-decoration: none; /* Bỏ gạch chân */
        font-size: 18px;
        transition: background-color 0.3s ease;
      }

      .buttonn a:hover {
        background-color: #2563eb; /* Màu nền khi hover */
      }
      .card-header {
        background-color: #b3e0f2;
      }
      .form-label {
        font-weight: bold;
      }
      .btn-save {
        background-color: #3b82f6;
        color: white;
      }
      .btn-clear {
        background-color: #38c172;
        color: white;
      }
      .btn-save {
        background-color: #3b82f6;
        color: white;
      }
      .btn-clear {
        background-color: #38c172;
        color: white;
      }

      .product-image {
        width: 120px;
        height: 100px;
        border-radius: 10px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
 <small th:if="${errors}" th:each="err : ${errors}" th:text="${err.defaultMessage}" style="color: red;"></small>
   
    <div class="container mt-5">
      <div class="card shadow-lg">
        <div class="card-header text-center">
          <h4>Thêm Sản Phẩm</h4>
        </div>
        <div class="card-body">
          <form
      
            action="/admin/product/index"
            method="post"
            enctype="multipart/form-data"
            th:object="${product}"
          >
            <div class="row">
              <!-- Ảnh sản phẩm -->
              <div class="col-md-3 text-center">
                <br>
                <img
                  id="previewImage"
                  th:src="@{|/img/${product.image}|}"
                  alt="Product Image"
                  class="product-image mb-3"
                />
                <input
                  type="file"
                  name="photoFile"
                  placeholder="Hình ảnh "
                  onchange="previewFile(event)"
                  id=""
                  
                  
                />
                
              </div>

              <!-- Thông tin sản phẩm -->
              <div class="col-md-9">
                <div class="mb-3">
                  <label for="id" class="form-label">ID</label>
                  <input
                    type="text"
                    class="form-control"
                    id="id"
                    th:field="*{id}"
                    placeholder="Product ID"
                    readonly
                  />
                </div>
                <div class="mb-3">
                  <label for="name" class="form-label">Tên sản phẩm</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                  
                    th:field="*{name}"
                    placeholder="Name Product"
                    
                  />
                  <small th:text="${nameError}"></small>
                 
                </div>
                <div class="mb-3">
                  <label for="price" class="form-label">Giá</label>
                  <input
                    type="number"
                    class="form-control"
                    id="price"
                    th:field="*{price}"
                    
                    placeholder="Price Product"
                  
                  />

                  <small th:text="${priceError}"></small>
                  
                </div>

                <div class="mb-3">
                  <label for="description" class="form-label">Mô tả </label>
                  <textarea
                    class="form-control"
                    id="description"
                    th:field="*{description}"
                    
                    placeholder="Description Product"
   
                  >
                  </textarea>
                 
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="category" class="form-label">Danh mục</label>
                    <select class="form-select" id="category" th:field="*{category.id}">
                      <option th:each="cat: ${categories}" th:value="${cat.id}" th:text="${cat.name}">Áo</option>
                      
                    </select>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Tình trạng</label><br />
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        id="available"
                        th:field="*{available}" 
                        value="true"
                        checked
                      />
                      <label class="form-check-label" for="available"
                        >Available</label
                      >
                    </div>
                    <div class="form-check form-check-inline">
                      <input
                        class="form-check-input"
                        type="radio"
                        th:field="*{available}"
                        id="not-available"
                        
                        value="false"
                      />
                      <label class="form-check-label" for="not-available"
                        >Not Available</label
                      >
                    </div>
                    <small th:text="${priceAvailable}"></small>
                    
                  </div>
                </div>

                <!-- Nút Save và Clear -->
                <div class="d-flex justify-content-start gap-2">
                  <button formaction="/admin/product/add" class="btn btn-save">Save</button>
                  <button formaction="/admin/product/update" class="btn btn-clear">Update </button>
                  <a href="/admin/product/reset">Reset</a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    

    <script>
      function resetForm() {
        document.getElementById("productForm").reset();
    }

    function previewFile(event){
      var reader = new FileReader();
      reader.onload = function(){
        var output = document.getElementById('previewImage');
        output.src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }
    </script>
  </body>
</html>
